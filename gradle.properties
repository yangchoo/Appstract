# Project-wide Gradle settings.
# Required: a transitive dependency still ships legacy com.android.support
# artifacts; Jetifier rewrites them to AndroidX. Removing it causes duplicate
# class errors (androidx.core vs com.android.support:support-compat:28.0.0).
android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xms512m -Xmx2048m
